<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Pessoa</title>
    <link rel="stylesheet" href="/pessoa/pessoa.css">
</head>

<body>
    <header>
        <h1>CRUD Pessoa</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Pessoa</h2>

            <form id="pessoaForm">
                <div class="search-container">
                    <label for="searchId">Buscar por CPF:</label>
                    <div class="search-input-group">
                        <input type="number" id="searchId" placeholder="Digite o ID para buscar">
                        <button type="button" id="btnBuscar">🔍 Buscar</button>

                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                        <button type="button" id="btnAlterar" class="btn-secondary"
                            style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados da Pessoa</legend>

                    <div class="form-group">
                        <label for="cpf_pessoa">CPF:</label>
                        <input type="text" id="cpf_pessoa" name="cpf_pessoa" required maxlength="11">
                    </div>
                    <div class="form-group">
                        <label for="nome_pessoa">Nome da Pessoa:</label>
                        <input type="text" id="nome_pessoa" name="nome_pessoa" required>
                    </div>
                    <div class="form-group">
                        <label for="email_pessoa">Email da Pessoa:</label>
                        <input type="email" id="email_pessoa" name="email_pessoa" required>
                    </div>
                    <div class="form-group">
                        <label for="data_nascimento_pessoa">Data de Nascimento da Pessoa:</label>
                        <input type="date" id="data_nascimento_pessoa" name="data_nascimento_pessoa" required>
                    </div>
                    <div class="form-group">
                        <label for="senha_pessoa">Senha da Pessoa:</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="password" id="senha_pessoa" name="senha_pessoa" required style="flex: 1;">
                            <button type="button" id="toggleSenha" class="btn-icon" title="Mostrar/Ocultar senha">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </fieldset>

                <fieldset id="formFieldsCliente" style="display: none;">
                    <legend>Dados do Cliente</legend>
                    <div class="form-group">
                        <label for="renda_cliente">Renda do Cliente:</label>
                        <input type="number" id="renda_cliente" name="renda_cliente" step="0.01">
                    </div>
                </fieldset>

                <fieldset id="formFieldsFuncionario" style="display: none;">
                    <legend>Dados do Funcionário</legend>
                    <div class="form-group">
                        <label for="id_cargo">Cargo:</label>
                        <select id="id_cargo" name="id_cargo">
                            <option value="">Selecione um cargo...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="salario_funcionario">Salário:</label>
                        <input type="number" id="salario_funcionario" name="salario_funcionario" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="porcentagem_comissao">Porcentagem de Comissão (%):</label>
                        <input type="number" id="porcentagem_comissao" name="porcentagem_comissao" step="0.01">
                    </div>
                </fieldset>

                <div id="tiposPessoa" style="margin: 1rem 0;">
                    <label><input type="checkbox" id="chkCliente"> Cliente</label>
                    <label><input type="checkbox" id="chkFuncionario"> Funcionário</label>
                </div>
            </form>
        </section>

        <section class="list-section">
            <div class="table-container">
                <table id="pessoasTable">
                    <thead>
                        <tr>
                            <th>CPF</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Data Nascimento</th>
                            <th>Tipo</th>
                            <th>Cargo (se Funcionário)</th>
                        </tr>
                    </thead>
                    <tbody id="pessoasTableBody">
                        <!-- Dados serão carregados dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CRUD Pessoa</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="/pessoa/pessoa.js" defer></script>

</body>

</html>
